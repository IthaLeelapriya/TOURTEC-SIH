services:
  # 1. Backend Express API Server
  - type: web
    name: tourtec-backend
    env: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tourtec-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Frontend React / Vite Static Site
  - type: web
    name: tourtec-frontend
    env: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tourtec-backend
          property: host

databases:
  # 3. PostgreSQL Database
  - name: tourtec-db
    databaseName: tourtec_db
    user: tourtec_user
    plan: free
