# ===================================================================
# TOURTEC INDIA - Spring Boot PostgreSQL Application Configuration
# ===================================================================

# Server Port matching React Frontend Proxy (Render passes PORT env var)
server.port=${PORT:5000}

# Application Name
spring.application.name=tourtec-backend

# ===================================================================
# PostgreSQL Database Configuration
# Supports local default and cloud environment variables (Render / Heroku)
# ===================================================================
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tourtec_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:leelapriya}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Spring Data JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JSON Pretty Print
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.tourtec=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
