version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-root}@db:5432/tourtec_db
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - FRONTEND_URL=http://localhost:5000
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: tourtec_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
